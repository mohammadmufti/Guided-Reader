name: Build and deploy

# Everything runs here, not on anyone's machine. Push to main and the site
# rebuilds; open a PR and it builds without deploying so you can see it fail
# before it matters.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: pip install pandas openpyxl pyyaml brotli pytest qalsadi farahidi

      # ---------------------------------------------------------------------
      # The source downloads are 70 MB and never change: the OpenITI text, the
      # vocalised Bukhari, and Lane's 61 MB database. fetch.py is idempotent and
      # checksum-guarded, so a cache hit means it verifies and exits.
      #
      # Keyed on the corpus configs, because that is what determines WHICH
      # sources are wanted. A checksum mismatch inside fetch.py still fails the
      # build loudly — the cache cannot smuggle in changed input.
      # ---------------------------------------------------------------------
      - name: Cache source downloads
        uses: actions/cache@v5
        with:
          path: pipeline/cache
          key: sources-${{ hashFiles('pipeline/corpora/*.yaml') }}

      # Lane is ingested whole, once, and shared across every corpus. 72 MB of
      # parsed entries, ~90 s to produce. Keyed on the ingester itself.
      # qalsadi over 22,464 forms takes about 2.5 minutes and the output only
      # changes when the workbook or the script does.
      - name: Cache morphological analysis
        id: morph-cache
        uses: actions/cache@v5
        with:
          path: pipeline/build/morphology
          key: morph-${{ hashFiles('pipeline/analyse.py', 'Tajrid_frequency_tables.xlsx') }}

      # Context disambiguation over 2,550 records takes about five minutes and
      # only changes when the records or the script do.
      - name: Cache context morphology
        id: context-cache
        uses: actions/cache@v5
        with:
          path: pipeline/build/tajrid/disambiguated.json
          key: context-${{ hashFiles('pipeline/disambiguate.py', 'pipeline/segment.py') }}

      - name: Cache Lane ingest
        id: lane-cache
        uses: actions/cache@v5
        with:
          path: pipeline/build/lane
          key: lane-${{ hashFiles('pipeline/lane.py') }}

      - name: Fetch sources
        run: |
          python pipeline/fetch.py --corpus lane
          python pipeline/fetch.py --corpus tajrid

      - name: Ingest Lane
        if: steps.lane-cache.outputs.cache-hit != 'true'
        run: python pipeline/lane.py

      # ---------------------------------------------------------------------
      # Contracts are generated from Python. If someone hand-edits the
      # TypeScript, this fails here rather than drifting silently.
      # ---------------------------------------------------------------------
      - name: Analyse morphology
        if: steps.morph-cache.outputs.cache-hit != 'true'
        run: |
          pip install qalsadi
          python pipeline/analyse.py

      - name: Check generated code is in sync
        run: python pipeline/codegen.py --check

      - name: Run the pipeline
        run: |
          python pipeline/segment.py --corpus tajrid
          # MUST come after segment (it reads records.json) and before build
          # (which applies the context overrides). Ordering it after build
          # produced a payload with no contextRoot at all, silently — the
          # tests caught it, the build did not.
          if [ ! -f pipeline/build/tajrid/disambiguated.json ]; then
            python pipeline/disambiguate.py --corpus tajrid
          fi
          python pipeline/lexicon.py --corpus tajrid
          python pipeline/bind.py    --corpus tajrid
          # GitHub Pages compresses on the fly and ignores .br/.gz siblings,
          # so producing them costs 136 s and 42 MB for nothing. On Cloudflare
          # Pages or Netlify, drop this flag — they do serve them.
          python pipeline/build.py   --corpus tajrid --no-precompress

      # The second corpus is the whole basis of the generalisation claim and is
      # exercised nowhere else. Segmenting it is cheap and it is the thing most
      # likely to rot unnoticed.
      - name: Segment the second corpus
        run: |
          python pipeline/fetch.py   --corpus rawd
          python pipeline/segment.py --corpus rawd

      # Pipeline tests run on EVERY build, including pushes. They need no
      # browser, add about ten seconds, and cover the part of the system whose
      # failures are silent — a mis-join or a lost stem produces a wrong word,
      # not an error.
      - name: Pipeline tests
        run: python -m pytest pipeline/tests -q

      - name: Typecheck and build the app
        working-directory: web
        env:
          # Pages serves from /<repo>/. Set to "/" for a custom domain.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npx tsc -b
          npm run build

      # Pages has no SPA fallback: a deep link to /hadith/42 would 404 on
      # reload. Serving index.html as the 404 page is the standard workaround
      # and costs one copy.
      - name: SPA fallback
        run: cp web/dist/index.html web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  # The end-to-end gates: 241 browser assertions across the reader, the word
  # panel and accessibility.
  #
  # Runs on EVERY build now, but `deploy` needs only `build` — so on a push to
  # main a red gate is a report, not a roadblock. This keeps the SPEC.md §8
  # decision ("a red build should not stand between one maintainer and a
  # deploy") while closing its side effect, recorded in GAPS.md §8: with the
  # old `if: pull_request` and every change landing directly on main, the 241
  # assertions had never once run against a real change. On a pull request the
  # gate still blocks, as before.
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: /tmp/site
      - name: Unpack and serve
        run: |
          mkdir -p /tmp/dist && tar -xf /tmp/site/artifact.tar -C /tmp/dist
          pip install playwright pillow && playwright install --with-deps chromium
          # NOT `python -m http.server`: it has no SPA fallback, so every
          # deep-link assertion in the gates would fail on a 404 that has
          # nothing to do with the app.
          # The base path MUST match the BASE_PATH the build job used — the
          # first CI runs of the gates failed because the server answered the
          # subpath-built app's own JS request with index.html.
          python web/serve.py /tmp/dist 5173 "/${{ github.event.repository.name }}/" &
          sleep 3
      - name: Gates
        working-directory: web
        env:
          E2E_BASE: http://127.0.0.1:5173/${{ github.event.repository.name }}
        run: |
          # phase 7 tests a stratified sample of words; derive it from the
          # artifact being tested, deterministically. This replaces a sample
          # file that only ever existed on the machine that authored the
          # gate — the reason the first real CI run of these suites failed.
          python e2e_sample.py --data /tmp/dist/data
          python e2e_phase5.py
          python e2e_phase6.py
          python e2e_phase7.py
          python e2e_phase8.py

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
