# Corpus configuration — Bulūgh al-Marām min adillat al-aḥkām
#
# Ibn Ḥajar al-ʿAsqalānī's collection of the hadith the jurists argue from,
# arranged by chapter of fiqh rather than by subject of report. 1,767 hadith.
#
# The line grammar is al-Tajrīd's: one structural level, `### | N - ` openers,
# kitāb and bāb headings in the same stream. That is not a coincidence — both
# come from Shamela through OpenITI — and it is why this file is short.

id: bulugh

display:
  titleAr: "بلوغ المرام من أدلة الأحكام"
  titleEn: "Bulūgh al-Marām"
  authorAr: "ابن حجر العسقلاني"
  author: "Ibn Ḥajar al-ʿAsqalānī"
  authorDied: "852 AH"
  edition: "Shamela 0009111 — verify against the OpenITI header before shipping"
  subject: "الحديث وأدلة الأحكام"
  # Public domain: the author died in 852 AH.
  rights: "public-domain"
  # It cites nothing; it IS the citation others make.
  crossRefLabel: null

sources:
  text:
    kind: http
    # CHOSEN BY MEASUREMENT, not by size. Three OpenITI versions exist; this one
    # aligns to the vocalised witness at a median coverage of 1.000 with 99% of
    # paragraphs matched. The `-ara3` version is more than twice as long
    # because it carries a commentary, which is a different book.
    #
    # Note the repository: 0875AH, not the 0900AH that rounding the author's
    # death date up would suggest. The OpenITI metadata gives the real path.
    uri: https://raw.githubusercontent.com/OpenITI/0875AH/master/data/0852IbnHajarCasqalani/0852IbnHajarCasqalani.BulughMaram/0852IbnHajarCasqalani.BulughMaram.Shamela0009111-ara1
    filename: bulugh.mARkdown
    encoding: utf-8

  vocalisation_reference:
    kind: http
    # 1,767 hadith, 44.1% of tokens vowelled OVERALL — but do not read that
    # as a thin scrape. Measured with the matn braces split out: the matn is
    # 90.1% vowelled; the bare mass is al-Albānī's takhrīj apparatus (25.3%),
    # which is equally unvowelled on the live site — the bare tokens are bare
    # at the source, and no better witness exists to fetch. Still lower than
    # al-Muwaṭṭaʾ's 98.7% or Nawawī's 94.8%, so more readings come from the
    # shared lexicon. Verified to be sunnah.com's own current text: identical
    # to a second pinned scrape on all 1,767 entries (sunnah_numbers.py), so
    # where a record aligns, the site is the harakāt ground truth.
    uri: https://raw.githubusercontent.com/AhmedBaset/hadith-json/main/db/by_book/other_books/bulugh_almaram.json
    filename: bulugh_vocalised.json
    encoding: utf-8
    notes: |
      Scraped from sunnah.com, which has its own terms. Used only as an
      alignment reference to transfer vocalisation and to resolve the hadith
      number; no text from it is redistributed in the app's output payload.

  # NO `lexicon` BLOCK. There is no workbook for this text. The inventory is
  # minted from the witness and meaning comes from the shared glossary.

# ---------------------------------------------------------------------------
segmentation:
  section: '^###\s*\|\s*(.*)$'
  # `### $` too. OpenITI marks a quoted passage that way, and this edition uses
  # it twice — both times for a du'a quoted INSIDE a hadith, with the line
  # before it ending mid-sentence (`أنه كان إذا قام إلى الصلاة قال`). The words
  # belong to the matn, so they are read as an ordinary paragraph rather than
  # left to fall through as an unrecognised marker, which failed the build.
  paragraph: '^(?:###\s*\$\s*:?|#)\s(.*)$'
  continuation: '^~~(.*)$'
  strip:
    - name: manuscript_marker
      pattern: '\bms\d+\b'
    - name: page_volume
      pattern: 'PageV\d+P\d+'
    - name: shamela_div
      pattern: '<div[^>]*>'
  page_marker_alt: 'PageV(\d+)P(\d+)'
  page_marker: '\[\s*ص\s*:\s*(\d+)\s*\]'
  opener: '^(\d+)\s*-\s*(.*)$'
  editorial_reference: null
  # Two levels in one stream, told apart by their first word — the same
  # arrangement al-Tajrīd has.
  heading_top_prefixes: ["كتاب"]
  # What a heading in this book actually starts with. The source marks 126
  # mid-sentence fragments as `### |` headings, and without this they split the
  # hadith they belong to — see segment.py.
  heading_prefixes: ["كتاب", "باب"]
  # NO ASIDE LAYER — and this is the second time that lesson was paid for.
  # The source follows many hadith with further `#` paragraphs — a variant's
  # `وللبخاري: «…»`, the author's own `أخرجه الثلاثة` and `وصححه أحمد` — and
  # twice they were carved into a "takhrij" aside on the theory that they are
  # an apparatus. They are not: they are ENTRY CONTENT, Ibn Hajar's own text,
  # inside the same single entry on the witness (its entry 6 carries the matn
  # AND all three variants) and inside the same numbered hadith in this
  # edition. Carving them out presented the hadith's own words as an
  # editorial aside, only for the minority of entries where the source
  # happened to break a paragraph, and read to a user exactly like footnotes
  # attached to the wrong hadith. `unnumbered_body_is_aside` stays OFF here;
  # the further paragraphs join their matn, which is where the witness has
  # them and why retrieval matches at median 1.000.
  #
  # What a "footnotes" feature would actually need — the numbered BODIES
  # behind the (1) (2) anchors, 2,037 of them — does not exist in this file:
  # the anchors survive, the notes behind them were never in the OpenITI
  # text (checked, not assumed), and the one source that has them is the
  # witness apparatus, non-redistributable and a modern editor's matter.
  numbering: edition
  # PER-HADITH LINK, through the verified address map. Two lessons are baked
  # into this block, both learned the hard way:
  #
  # First: the dataset's `idInBook` IS NOT the number in a sunnah.com URL —
  # the site merges entries, so index and numbering drift — and a link built
  # on that assumption was shipped and backed out. The binder still stamps
  # `idInBook` (the row a record aligned to, vouched for by its coverage),
  # but the build TRANSLATES it through corpora/data/bulugh_sunnah_links.json,
  # derived and verified by pipeline/sunnah_numbers.py; an index the map does
  # not know fails the build rather than shipping.
  #
  # Second, and specific to this book: sunnah.com has NO complete numbering
  # for Bulugh at all. The line this comment replaced read "its hadith N is
  # sunnah.com's bulugh:N" — copied from a corpus where that is true, false
  # here in three different ways (our edition runs 1-1582, theirs would run
  # 1-1767, and theirs does not exist: colon numbers cover five of sixteen
  # books and the site assigns 31 of them twice). What is universal and
  # unique on the site is the path form bulugh/{book}/{pos}, verified against
  # live pages during derivation — so that is the address, and the display
  # number (recordLinkNumber) is the colon number where the site has one and
  # null where it never assigned one.
  record_link:
    label: "sunnah.com"
    labelAr: "سنة.كوم"
    url: "https://sunnah.com/{ref}"
    layers: [matn]
    number_from_witness: true
    link_map: "corpora/data/bulugh_sunnah_links.json"
    ref_template: "bulugh/{book}/{pos}"
  # CHAPTER LINK, matched by title. Our ninth kitab is كتاب الطلاق, which
  # sunnah.com does not carry as a chapter of its own — so a positional map
  # would be off by one from there on and every later link would land in the
  # wrong book. Matching by title maps the 16 that correspond and leaves
  # الطلاق unlinked, which is the honest result.
  chapter_link:
    level: kitab
    label: "sunnah.com"
    labelAr: "سنة.كوم"
    url: "https://sunnah.com/bulugh/{n}"
  layer_names:
    body: matn
    top: heading_kitab
    sub: heading_bab
    front: frontmatter
  curated_index_phantoms: false

gates:
  # MEASURED on the first binding run: 95.2% Tier 1+2 on matn, with 1,682 of
  # 1,692 records matched at median coverage 1.000 — higher than a witness
  # 44% vowelled overall suggests, explained once the apparatus is split out:
  # the matn itself is 90.1% vowelled. (A briefly shipped carve-out of the
  # trailing paragraphs measured 99.3% on the shortened matn and attributed
  # the lift to the apparatus; the attribution was wrong — those paragraphs
  # are entry content, the carve was reverted, and the figure with them
  # restored is the 95.2% above.)
  #
  # Threshold set below the measurement so it catches regression rather than
  # restating today's figure.
  min_witnessed_matn: 90.0
  min_retrieval_median: 0.85

about:
  description:
    - >-
      Bulūgh al-Marām min adillat al-aḥkām — Ibn Ḥajar al-ʿAsqalānī's
      (d. 852 AH) collection of the hadith that the jurists reason from,
      arranged by chapter of fiqh. Each report is followed by a note on who
      narrated it and how it was graded, which is what the book is for.
    - >-
      Every word is tappable. This text has no frequency workbook of its own:
      its vocalisation is transferred from a vowelled edition, and its glosses
      are shared from al-Tajrīd, where the same word in the same reading
      carries the same entry. Its witness is thinner than the other books'
      here, so expect more words vowelled from the lexicon than from an
      aligned reading; the panel says which for each word.
  sources:
    - label: "Primary text"
      detail: >-
        OpenITI mARkdown transcription of a Shamela edition, fetched and
        checksummed at build time. Chosen over the other two OpenITI versions
        by measurement: it aligns to the vowelled witness at a median word
        overlap of 1.000. The longest version carries a commentary and is a
        different book.
      url: https://raw.githubusercontent.com/OpenITI/0875AH/master/data/0852IbnHajarCasqalani/0852IbnHajarCasqalani.BulughMaram/0852IbnHajarCasqalani.BulughMaram.Shamela0009111-ara1
    - label: "Vocalisation"
      detail: >-
        A partially vowelled text of the 1,767 hadith, scraped from sunnah.com
        — verified identical to the site's current text. The matn is 90%
        vowelled; the takhrīj apparatus around it is mostly bare, there as
        here. Used only to transfer vocalisation; none of it is redistributed
        here.
      url: https://github.com/AhmedBaset/hadith-json
    - label: "Meaning"
      detail: >-
        Glosses, lemmas and roots come from al-Tajrīd's curated lexicon, which
        is keyed by the written form rather than by the book it was written
        for. Words this text shares with al-Tajrīd inherit its scholarship;
        words it does not are vowelled but unglossed, and say so.
