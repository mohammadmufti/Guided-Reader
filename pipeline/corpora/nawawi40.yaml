# Corpus configuration — al-Arbaʿūn al-Nawawiyya
#
# The smallest corpus by a wide margin: 42 hadith, 3,465 tokens, against
# al-Tajrid's 127,163. That makes it the cheapest end-to-end exercise of the
# derived path there is, and a useful canary — anything that only works at
# scale, or only on a text with a curated workbook, fails here loudly.
#
# THE NUMBERING IS SPELLED OUT, NOT WRITTEN IN DIGITS. Headings read
# `### | الحديث الأول`, `### | الحديث الثاني`, through الثاني والأربعون. No
# `opener` pattern can parse that without a table of Arabic ordinals, which
# would be text-specific code in a shared module. So the heading stays a
# heading and `numbering: continuous` assigns the address by position — which
# is exactly right here, because the position IS the number: this text is a
# numbered sequence of forty-two, and nothing else.

id: nawawi40

display:
  titleAr: "الأربعون النووية"
  titleEn: "al-Arbaʿūn al-Nawawiyya — maʿ ziyādāt Ibn Rajab"
  authorAr: "يحيى بن شرف النووي"
  author: "Yaḥyā b. Sharaf al-Nawawī"
  authorDied: "676 AH"
  edition: "unknown — verify against the OpenITI header before shipping"
  subject: "الحديث والأربعينيات"
  # Public domain: the author died in 676 AH.
  rights: "public-domain"
  asideNote: "من زيادات الحافظ ابن رجب الحنبلي — ليست من الأربعين النووية"
  # This text cites nothing; it IS the citation others make.
  crossRefLabel: null

sources:
  text:
    kind: http
    # The `-ara2` edition, which carries Ibn Rajab al-Hanbali's ziyadat: forty
    # -two hadith from al-Nawawi plus eight appended, fifty in all. The sibling
    # `-ara1` has only the forty-two.
    #
    # Three structural levels, and they do not nest consistently: al-Nawawi's
    # hadith are at `### |||` under `[الأحاديث]`, Ibn Rajab's at `### ||` under
    # `[زيادات ابن رجب الحنبلي]`. Between them sits an appendix on vowelling
    # difficult words whose ten sub-headings are also called `الحديث الأول`
    # and so on — references to hadith rather than hadith, which is what
    # `front_prefixes` excludes.
    uri: https://raw.githubusercontent.com/OpenITI/0700AH/master/data/0676Nawawi/0676Nawawi.ArbacunaNawawiyya/0676Nawawi.ArbacunaNawawiyya.Sham19Y0147927-ara2
    filename: nawawi40.mARkdown
    encoding: utf-8

  vocalisation_reference:
    kind: http
    # JSON, not CSV. Scraped from sunnah.com: 42 hadith, 2,694 tokens, 90.7%
    # of them vowelled. Same shape as the Muwatta' dataset from the same repo.
    uri: https://raw.githubusercontent.com/AhmedBaset/hadith-json/main/db/by_book/forties/nawawi40.json
    filename: nawawi40_vocalised.json
    encoding: utf-8
    notes: |
      Scraped from sunnah.com, which has its own terms. Used only as an
      alignment reference to transfer vocalisation; no text from it is
      redistributed in the app's output payload.

  # NO `lexicon` BLOCK. There is no workbook for this text and there will not
  # be one. The inventory is minted from the witness and meaning comes from
  # the shared glossary.

# Meaning for the forty-two comes from al-Tajrid's curated glosses via the
# glossary, which `bind.py` reads automatically. Both are hadith Arabic and
# `match_id` is derived from the form, so the overlap should be high.

# ---------------------------------------------------------------------------
segmentation:
  # One structural level in practice: 43 `### |` (a preface plus the forty-two)
  # and a single `### ||` under the preface.
  # `AUTO`, `CHECK` and `EDITOR` are OpenITI's own editorial tags on a heading,
  # not part of its title. Consumed here so the prefixes below match the words
  # a reader would see.
  # `AUTO` and `CHECK` are OpenITI's confidence tags on a heading, not part of
  # its title, and are consumed so the prefixes below match the words a reader
  # would see. `EDITOR` is NOT consumed: it marks the edition's own apparatus —
  # title page, endnotes — which is front matter, and is listed as such below.
  section: '^###\s*(\|+)\s*(?:AUTO|CHECK)?\s*(.*)$'
  section_levels:
    "|": top
    "||": sub
    "|||": sub
  paragraph: '^#\s(.*)$'
  continuation: '^~~(.*)$'
  strip:
    - name: manuscript_marker
      pattern: '\bms\d+\b'
    - name: page_volume
      pattern: 'PageV\d+P\d+'
    - name: shamela_div
      pattern: '<div[^>]*>'
  page_marker_alt: 'PageV(\d+)P(\d+)'
  page_marker: '\[\s*ص\s*:\s*(\d+)\s*\]'
  # Spelled out, not numbered — see the note at the top of this file.
  opener: null
  editorial_reference: null
  # This text cites nothing, but IS cited: its hadith N is sunnah.com's
  # nawawi40:N. Our numbering runs 1-42 in the same order as the witness, which
  # is the same scrape sunnah.com serves, so the correspondence is exact rather
  # than approximate.
  record_link:
    label: "sunnah.com"
    labelAr: "سنة.كوم"
    url: "https://sunnah.com/nawawi40:{n}"
  heading_top_prefixes: []
  # The preface is a section like any other in the file; without this it
  # takes number 1 and the forty-two start at 3.
  front_prefixes:
    - "مقدمة"
    - "أما بعد"
    - "باب الإشارات"          # appendix on vowelling; its sub-headings are refs
    # This edition brackets its structural headings; the bare forms are
    # kept because the ara1 sibling does not.
    - "خطبة"
    - "[خطبة"
    - "خاتمة"
    - "[خاتمة"
    - "بسم الله"              # editor's foreword
    - "تقديم"
    - "EDITOR"                # title page and endnotes: the edition's own
    - "Endnotes"
  # After this section, records are additions to the book rather than part of
  # its original sequence — but still numbered and navigable.
  aside_section_prefixes: ["[زيادات ابن رجب"]
  number_asides: true
  numbering: continuous
  layer_names:
    body: matn
    aside: ziyada
    top: heading_kitab
    sub: heading_bab
    front: frontmatter
  curated_index_phantoms: false

gates:
  # MEASURED on the first binding run: 94.0% Tier 1+2 on matn (Tier 1 59.0%,
  # Tier 2 34.9%), 4.8% unbound, all 42 records matched at median coverage
  # 0.881. Higher than the Muwatta's 73.0% despite having no workbook either —
  # a short text whose whole content is witnessed leaves the alignment very
  # little to miss. Threshold set below the measurement so it catches
  # regression rather than restating today's figure.
  min_witnessed_matn: 88.0
  min_retrieval_median: 0.85

# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Two recitations of the same fifty. Offered side by side rather than one
# chosen for the reader: which voice suits a listener is not ours to settle.
#
# Hosted as GitHub release assets, same as al-Tajrid's. NOTE that GitHub serves
# those as `application/octet-stream` with `content-disposition: attachment`,
# which iOS Safari refuses to play — see AudioButton.tsx. The reader falls back
# to a direct link there. Rehosting somewhere that sends `audio/mpeg` fixes it
# for every corpus at once.
recitation:
  numbers: [[1, 50]]
  reciters:
    - label: "أبو أسامة"
      labelEn: "Abū Usāma"
      baseUrl: https://github.com/mohammadmufti/Guided-Reader/releases/download/audio-nawawi40-v1/
      pattern: "al-arbaoon_an-Nawawi_Abu_Usamah_ar_{n:04d}.mp3"
    - label: "حامد الدرهيم"
      labelEn: "Ḥāmid al-Darāhim"
      baseUrl: https://github.com/mohammadmufti/Guided-Reader/releases/download/audio-nawawi40-v1/
      pattern: "al-arbaoon_an-Nawawi_hamed_ad-darahim_ar_{n:04d}.mp3"

about:
  description:
    - >-
      Al-Arbaʿūn al-Nawawiyya — the forty-two hadith gathered by Yaḥyā b.
      Sharaf al-Nawawī (d. 676 AH) as the traditions on which, in his words,
      Islam turns. Short, memorised for seven centuries, and the usual first
      hadith text a student meets.
    - >-
      Every word is tappable. This text has no frequency workbook of its own:
      its vocalisation is transferred from a fully vowelled edition, and its
      glosses are shared from al-Tajrīd, where the same word in the same
      reading carries the same entry. The panel's provenance line says which
      applies to each word.
  sources:
    - label: "Primary text"
      detail: >-
        OpenITI mARkdown transcription of the Shamela edition, fetched and
        checksummed at build time. The sibling OpenITI version carries Ibn
        Rajab's additions and runs to fifty hadith; this one is the forty-two.
      url: https://raw.githubusercontent.com/OpenITI/0700AH/master/data/0676Nawawi/0676Nawawi.ArbacunaNawawiyya/0676Nawawi.ArbacunaNawawiyya.Shamela0012836-ara1.mARkdown
    - label: "Vocalisation"
      detail: >-
        A fully vowelled text of the forty-two, scraped from sunnah.com. Used
        only to transfer vocalisation onto the words of the primary text; none
        of it is redistributed here. All 42 records aligned, at a median word
        overlap of 0.88.
      url: https://github.com/AhmedBaset/hadith-json
    - label: "Meaning"
      detail: >-
        Glosses, lemmas and roots come from al-Tajrīd's curated lexicon, which
        is keyed by the written form rather than by the book it was written
        for. Words this text shares with al-Tajrīd inherit its scholarship;
        words it does not are vowelled but unglossed, and say so.
