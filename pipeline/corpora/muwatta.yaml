# Corpus configuration — Muwatta' Malik
#
# (A header here used to warn this was a Phase 3 draft that could not bind.
# That was true before Phase 1 made bind.py and lexicon.py corpus-aware; the
# corpus has bound and shipped since — the gate measurements below are its
# own. Removed 2026-08, having outlived the code it warned about.)
#
# RECENSION WARNING. OpenITI carries nine Muwatta' versions and they are not
# nine digitisations of one text — they are different riwayat with different
# hadith selections and orderings:
#
#     Shamela0001699   Yahya al-Laythi (the standard recension)  148,370 tok
#     Shamela0008140   Yahya al-Laythi, different edition        158,481 tok
#     ShamAY0033921    riwayat Ibn al-Qasim                       33,757 tok
#     ShamAY0033922    riwayat Ibn Ziyad                           5,878 tok
#     ShamAY0033923    riwayat Suwayd b. Sa'id al-Hadathani       87,723 tok
#     Shamela0016050   riwayat Muhammad b. al-Hasan al-Shaybani   64,449 tok
#     Shamela0028107   with apparatus                            245,646 tok
#     Shia000901Vols   multi-volume edition                      219,281 tok
#
# The vocalisation reference below is the Yahya al-Laythi recension, so the
# source MUST be one too. Measured retrieval coverage against it, using the
# project's own normalise() and IDF retrieval:
#
#     Shamela0001699   median 0.962   <- chosen
#     JK000466         median 0.912
#     Shamela0008140   median 0.731
#     Shamela0016050   median 0.617   (Shaybani — a genuinely different text)
#     Shamela0028107   median 0.500
#     Shia000901Vols   median 0.429
#
# 0.962 matches what al-Tajrid scores against Bukhari (0.96). The low scorers
# are not noisier scans; they are other books. If a future corpus's retrieval
# median comes in low, suspect the recension before suspecting the pipeline.

id: muwatta

display:
  titleAr: "موطأ الإمام مالك"
  # The recension belongs in the NAME. Nine of these exist in OpenITI and
  # they are different books; a reader choosing between them, or citing
  # what they read, needs to know which one this is.
  titleEn: "Muwaṭṭaʾ Mālik — riwāyat Yaḥyā al-Laythī"
  authorAr: "مالك بن أنس الأصبحي المدني"
  author: "Mālik b. Anas al-Aṣbaḥī al-Madanī"
  authorDied: "179 AH"
  edition: "unknown — verify against the OpenITI header before shipping"
  # Measured at Phase 3: 61 kitab, 702 bab, 1,891 hadith, 146,009 tokens.
  recension: "riwayat Yahya b. Yahya al-Laythi (matches the witness)"
  subject: "الحديث والموطآت"
  # Public domain: the author died in 179 AH.
  rights: "public-domain"
  # Phase 0 (A2) made this configurable. It is what the UI prints beside a
  # cross-reference number; al-Tajrid says "بخاري", this text cites nothing.
  crossRefLabel: null

sources:
  text:
    kind: http
    # NOTE THE EXTENSION. al-Tajrid's URI is bare, al-Rawd carries `.mARkdown`,
    # this one carries `.completed`. Do not copy either sibling's comment about
    # "the bare URI IS the file" forward — it is true only of al-Tajrid.
    uri: https://raw.githubusercontent.com/OpenITI/0200AH/master/data/0179MalikIbnAnas/0179MalikIbnAnas.Muwatta/0179MalikIbnAnas.Muwatta.Shamela0001699-ara1.completed
    filename: muwatta.mARkdown
    encoding: utf-8

  vocalisation_reference:
    kind: http
    # Same repo and same shape as the Bukhari witness already in use: single
    # column, header row literally "Maliks Muwatta", one hadith per row.
    # 1,594 rows, 98.7% of tokens carry at least one mark (0.869 marks/letter).
    # Spaces in the path MUST be percent-encoded, as the Bukhari URI is.
    uri: https://raw.githubusercontent.com/abdelrahmaan/Hadith-Data-Sets/master/All%20Hadith%20Books/Maliks%20Muwatta.csv
    filename: muwatta_vocalised.csv
    encoding: utf-8

  # A SECOND Muwatta', carrying entry numbers — the same arrangement
  # al-Tajrid has with its two Bukharis. The CSV above vowels better than
  # anything else available but is a single column that cannot say WHICH
  # hadith a row is (1,594 rows against the site's 1,985 entries — a
  # different dataset, not row-aligned to anything). This one is the
  # sunnah.com scrape, 1,985 hadith in 61 chapters, and its `idInBook` is
  # what the address map (corpora/data/muwatta_sunnah_links.json) translates
  # into the site's own /malik/{book}/{pos} pages. Merged into one retrieval
  # index: the CSV row usually wins the vowelling, and the binder resolves
  # the NUMBER against the numbered rows separately — see bind.py.
  cross_reference_witness:
    kind: http
    uri: https://raw.githubusercontent.com/AhmedBaset/hadith-json/main/db/by_book/the_9_books/malik.json
    filename: muwatta_numbered.json
    encoding: utf-8
    notes: |
      Scraped from sunnah.com, which has its own terms. Used only as an
      alignment reference and to resolve a hadith's site address; no text
      from it is redistributed in the payload.
    notes: |
      Repo is unlicensed (no LICENSE file). Used here only as an alignment
      reference to transfer vocalisation; no text from it is redistributed in
      the app's output payload. Same treatment as the Bukhari witness.

  # NO `lexicon` BLOCK — deliberately.
  #
  # No frequency workbook exists for this text. Under Phase 1 that is a legal
  # configuration: Tier 1 is unavailable, and Tiers 3 and 4 with it, because
  # all three need lexicon candidates. The corpus binds on Tier 2 (witness) and
  # Tier 5 (unbound) alone. `bind.py` must report that in words rather than
  # printing 0% and letting it look like a failure.

# Gloss donors. NOT a source of candidate readings -- see `Lexicon.enrich_from`.
# These workbooks fill in what a word MEANS for readings this corpus already
# arrived at from its own witness. Measured at Phase 5: 89.0% of bound matn
# tokens are readings al-Tajrid's workbook already glosses, because both texts
# are hadith Arabic and `match_id` is derived from the form rather than from
# frequency.
# MEASURED at Phase 5, after enrichment: 6,211 of 12,878 minted readings gain a
# gloss, covering 73.0% of matn tokens (89.0% of bound ones). 9.1% of matn is
# clickable but has nothing to say; 17.9% is unbound and shown bare. Tiering is
# byte-identical with and without donors, which is the property that makes this
# safe: enrichment cannot move a binding.
# Superseded by build/glossary/glossary.json, which `bind.py` reads
# automatically. Kept only as a fallback for a checkout where the glossary has
# not been exported yet; remove once `glossary.py` is part of the normal run.
lexicon_donors:
  - tajrid

# ---------------------------------------------------------------------------
# Segmentation.
#
# First corpus to use TWO structural levels. al-Tajrid has one (`### |`), and
# al-Rawd has one. Here `### |` is a kitab and `### ||` is a bab — 61 and 702
# of them respectively in this version.
segmentation:
  # TWO capture groups: level marker, then title. With `section_levels` below
  # this tells the segmenter the hierarchy instead of making it guess from the
  # heading's wording — which cannot work here, because a kitab heading reads
  # `1 - كتاب وقوت الصلاة` and matches the numbered-opener rule.
  section: '^###\s*(\|+)\s*(.*)$'
  section_levels:
    "|": top
    "||": sub
  paragraph: '^#\s(.*)$'
  continuation: '^~~(.*)$'
  strip:
    - name: manuscript_marker
      pattern: '\bms\d+\b'
    - name: page_volume
      pattern: 'PageV\d+P\d+'
    - name: shamela_div
      pattern: '<div[^>]*>'
  page_marker_alt: 'PageV(\d+)P(\d+)'
  page_marker: '\[\s*ص\s*:\s*(\d+)\s*\]'
  # DRAFTED WRONG, corrected against the file. This text DOES number, twice
  # over: kitab headings read `### | 1 - كتاب وقوت الصلاة`, and each hadith is
  # opened by a bare `# 1 - ` on a line of its own with the text following on
  # the NEXT body line. al-Tajrid puts the number and the text on one line.
  opener: '^(\d+)\s*-\s*(.*)$'
  # The number sits on a BODY line here, not on the section line. Default is
  # `section`, which is al-Tajrid's grammar.
  opener_on: paragraph
  # The edition restarts hadith numbering at 1 in every kitab — 61 restarts,
  # maximum 255 — so the printed number cannot address a hadith on its own.
  # A running displayNumber is assigned over the whole text; the edition's own
  # number survives as editionNumber and is shown in the heading.
  numbering: continuous
  #
  # CHECKED AGAINST AN EXTERNAL WITNESS (sunnah.com), and the answer is that
  # the continuous number is an ADDRESS, not a citation.
  #
  #   sunnah.com/malik lists 61 books; we segment 61 kitab, same order,
  #   same titles. That part agrees exactly.
  #
  #   sunnah.com's "Arabic reference" is itself a running count across the
  #   whole work: Book 4 Hadith 1 is Arabic reference 223. Ours makes it 217
  #   -- a drift of 6 by the fourth book.
  #
  #   The drift is NOT missing hadith. Our per-kitab numbering is gapless
  #   against this file: book 1 = 1..30, book 2 = 1..115, book 3 = 1..70,
  #   book 4 = 1..3, no gaps. sunnah.com's Arabic reference gives book 1
  #   thirty-TWO hadith. It is numbering a different printed edition.
  #
  # So `displayNumber` must never be presented as "the hadith number": it
  # matches no printed edition and no external reference, and a reader who
  # cited it would be citing us. It is a stable in-app address. What gets
  # SHOWN is `editionNumber` together with its kitab -- "Book 3, Hadith 70" --
  # which is the form every external reference uses and which does resolve.
  # No editorial cross-reference apparatus. Phase 0 (A3) means declaring
  # nothing here strips nothing — previously `(بخاري: N)` was removed from
  # every corpus whether or not it made sense.
  editorial_reference: null
  # sunnah.com's BOOK pages for this text are numbered 1-61 in the same order
  # and with the same titles as this edition — checked title by title against
  # the scraped dataset: 60 of 61 identical, the one difference being a
  # naming variant in the same slot (ours كتاب الجامع, theirs كتاب المدينة),
  # not a shift. `{n}` is the kitab index. (An earlier version of this
  # comment said the site carries the text as one page per book and nothing
  # finer; per-hadith pages exist — /malik/{book}/{pos}, see record_link
  # below — and this kitab link is now the FALLBACK for records the binder
  # could not place.)
  #
  # `match: position`, DECLARED because it is verified. The default mode
  # matches heading titles against the witness JSON's `chapters` array, which
  # this corpus cannot use: its witness is a single-column CSV with no chapter
  # metadata. When the Reader moved from our kitab index to the build-stamped
  # `chapterLinkNumber`, that requirement silently unmapped every one of these
  # links — the build shipped `corpus.chapterLink` with every number null.
  # Positional stamping is exactly what the old Reader did, and it is sound
  # HERE because the 61-to-61 correspondence was checked and is pinned by
  # test_muwatta_chapter_indices_match_sunnah_com; a corpus that has not done
  # that check must not copy this key (Bulugh's 17-to-16 is the counterexample
  # — positional there puts every kitab after الطلاق in the wrong book).
  chapter_link:
    match: position
    label: "sunnah.com"
    labelAr: "سنة.كوم"
    url: "https://sunnah.com/malik/{n}"

  # PER-HADITH LINK, through the verified address map. The kitab link above
  # predates the discovery that sunnah.com DOES serve this text one page per
  # hadith — /malik/{book}/{pos} — it just never advertises a collection
  # numbering. Measured on live pages before anything was built: the URL's
  # {pos} is the site's "Sunnah.com reference", which equals the entry's
  # per-book ordinal in every one of the 34 entries across 30+ books where
  # the site displays the row (gapless, unlike Bulugh's), and the USC-MSA
  # numbering is provably NOT it (gaps at 2/6->9, three entries numbered 10).
  # Anchors read live: /malik/1/1 is عمر بن عبد العزيز أخر الصلاة,
  # /malik/15/2 is the strap-of-the-mushaf entry.
  #
  # The binder resolves the entry against the numbered second witness (its
  # rows carry `idInBook`), the map translates that into {book}/{pos}, and a
  # record the numbered rows cannot vouch for gets no link and keeps the
  # kitab link above as its fallback — same policy as Bulugh.
  record_link:
    label: "sunnah.com"
    labelAr: "سنة.كوم"
    url: "https://sunnah.com/{ref}"
    layers: [matn]
    number_from_witness: true
    link_map: "corpora/data/muwatta_sunnah_links.json"
    ref_template: "malik/{book}/{pos}"

  heading_top_prefixes: ["كتاب"]
  layer_names:
    body: matn
    top: heading_kitab
    sub: heading_bab
    front: frontmatter
  curated_index_phantoms: false

# ---------------------------------------------------------------------------
# Gates. Per-corpus rather than global, because a witness-only corpus cannot
# reach al-Tajrid's 90% and lowering the global constant would quietly weaken
# al-Tajrid's own guarantee.
gates:
  # Tier 1+2 on matn. Set from the Phase 4 measurement, not guessed — this
  # placeholder must be replaced with the observed figure and a note saying so.
  # MEASURED at Phase 4, witness-only (no workbook):
  #   Tier 2 (witnessed at position, high) 24.2% of matn
  #   Tier 1 (minted, unopposed, MEDIUM)   40.8%
  #   Tier 3 / 4 (inferred)                 6.9% / 10.2%
  #   Tier 5 (unbound, shown bare)         17.9%
  # Tier 1+2 = 65.0%, against al-Tajrid's 97.2%. Set deliberately BELOW the
  # measurement so the gate catches regression rather than merely restating
  # today's number, and nowhere near al-Tajrid's 90% — which this corpus
  # cannot reach and should not be judged against.
  # Re-measured after `seed_from_witness`: reading the witness as a TYPE
  # lexicon rather than only as aligned rows took Tier 1+2 from 65.0% to 73.0%
  # and unbound from 17.9% to 6.8%. Threshold left below the measurement so it
  # catches regression rather than restating today's figure.
  # Re-measured after the numbered second witness was merged into the index
  # (for the per-hadith links): Tier 1+2 on matn 86.2%, retrieval 1,873 of
  # 1,891 at median 0.980 — the sunnah.com rows also improved some readings,
  # the same effect al-Tajrid saw. Threshold unchanged, still below.
  min_witnessed_matn: 68.0
  # Retrieval health. Below this the recension is probably wrong.
  # MEASURED at Phase 3 against the real segmentation: median 0.963,
  # 86.2% of 1,891 matn records matched at >= 0.35. 0.85 leaves room for
  # edition noise while still failing loudly on a wrong recension
  # (al-Shaybani's scores 0.617 against this same witness).
  min_retrieval_median: 0.85

# ---------------------------------------------------------------------------
about:
  description:
    - >-
      Al-Muwaṭṭaʾ — Mālik b. Anas's (d. 179 AH) collection of hadith and the
      settled practice of Madina, and the earliest surviving book of its kind.
      This is the recension of Yaḥyā b. Yaḥyā al-Laythī, the one most widely
      read; OpenITI carries nine Muwaṭṭaʾ versions and they are different
      books, not different scans.
    - >-
      Every word is tappable. This text has no frequency workbook of its own:
      its vocalisation is transferred from a fully vowelled edition, and its
      glosses are shared from al-Tajrīd, where the same word in the same
      reading carries the same entry. Roughly a fifth of the words are
      vowelled but unglossed, and the panel says so rather than showing a
      blank.
  sources:
    - label: "Primary text"
      detail: >-
        OpenITI mARkdown transcription of a Shamela edition of the Laythī
        recension, fetched and checksummed at build time. Chosen over the
        other eight by measurement: it aligns to the vowelled witness at a
        median word overlap of 0.96, where al-Shaybānī's recension scores
        0.62 against the same witness because it is a different book.
      url: https://raw.githubusercontent.com/OpenITI/0200AH/master/data/0179MalikIbnAnas/0179MalikIbnAnas.Muwatta/0179MalikIbnAnas.Muwatta.Shamela0001699-ara1.completed
    - label: "Vocalisation"
      detail: >-
        A fully vowelled Laythī text, 98.7% of whose words carry harakāt.
        Used only to transfer vocalisation onto the words of the primary text;
        none of it is redistributed here.
      url: https://github.com/abdelrahmaan/Hadith-Data-Sets
    - label: "Meaning"
      detail: >-
        Glosses, lemmas and roots come from al-Tajrīd's curated lexicon, which
        is keyed by the written form rather than by the book it was written
        for. Both are hadith Arabic, so most of the running text is covered.
    - label: "Numbering"
      detail: >-
        The edition restarts hadith numbering in every kitāb, so the number
        shown is a running count across the whole work and matches no printed
        copy. Where the edition prints its own number it appears beside it as
        "ed. N"; that number, with its kitāb, is what a citation should quote.
        The kitāb title links to the same book on sunnah.com.
