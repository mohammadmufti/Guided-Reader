# Corpus configuration — al-Shamāʾil al-Muḥammadiyya
#
# Al-Tirmidhī's collection on the person of the Prophet — his appearance, his
# habits, his manner — rather than on rulings. 402 hadith in 57 chapters, all
# of them bāb with no kitāb above them, which is why `heading_top_prefixes` is
# empty here and not in Bulūgh's config.

id: shamail

display:
  titleAr: "الشمائل المحمدية"
  titleEn: "al-Shamāʾil al-Muḥammadiyya"
  authorAr: "محمد بن عيسى الترمذي"
  author: "Muḥammad b. ʿĪsā al-Tirmidhī"
  authorDied: "279 AH"
  edition: "Shamela 0013037 — verify against the OpenITI header before shipping"
  subject: "الشمائل والسيرة"
  # Public domain: the author died in 279 AH.
  rights: "public-domain"
  crossRefLabel: null

sources:
  text:
    kind: http
    # Two OpenITI versions align equally well (median coverage 1.000 on both).
    # This one is taken for having the marginally higher match rate, 100%
    # against 99%, and the difference is small enough that either would do.
    uri: https://raw.githubusercontent.com/OpenITI/0300AH/master/data/0279Tirmidhi/0279Tirmidhi.ShamailMuhammadiyya/0279Tirmidhi.ShamailMuhammadiyya.Shamela0013037-ara1
    filename: shamail.mARkdown
    encoding: utf-8

  vocalisation_reference:
    kind: http
    # 402 hadith, 87.5% of tokens vowelled — a good witness, close to Nawawī's.
    uri: https://raw.githubusercontent.com/AhmedBaset/hadith-json/main/db/by_book/other_books/shamail_muhammadiyah.json
    filename: shamail_vocalised.json
    encoding: utf-8
    notes: |
      Scraped from sunnah.com, which has its own terms. Used only as an
      alignment reference to transfer vocalisation and to resolve the hadith
      number; no text from it is redistributed in the app's output payload.

  # NO `lexicon` BLOCK: no workbook, as for every corpus after al-Tajrīd.

# ---------------------------------------------------------------------------
segmentation:
  section: '^###\s*\|\s*(.*)$'
  paragraph: '^#\s(.*)$'
  continuation: '^~~(.*)$'
  strip:
    - name: manuscript_marker
      pattern: '\bms\d+\b'
    - name: page_volume
      pattern: 'PageV\d+P\d+'
    - name: shamela_div
      pattern: '<div[^>]*>'
  page_marker_alt: 'PageV(\d+)P(\d+)'
  page_marker: '\[\s*ص\s*:\s*(\d+)\s*\]'
  opener: '^(\d+)\s*-\s*(.*)$'
  editorial_reference: null
  # EMPTY, unlike Bulūgh. This text has 57 bāb and no kitāb above them, so a
  # `كتاب` prefix would promote nothing and inventing a top level would state a
  # structure the book does not have.
  heading_top_prefixes: []
  numbering: edition
  # NO PER-HADITH LINK. It was built from the dataset's `idInBook`, on the
  # assumption that this is the number in a sunnah.com URL. IT IS NOT:
  # sunnah.com/shamail:317 serves the hadith the dataset calls 306, and the
  # dataset's own 317 is a different report entirely.
  #
  # The alignment behind it is sound — a record matches its dataset row at a
  # median coverage of 1.000, and that is what supplies the vowels. What was
  # never verified is the step from row to URL, and it cannot be verified from
  # this data: the dataset carries `id`, `idInBook` and `chapterId`, and none
  # of them is the site's hadith number.
  #
  # A wrong link is worse than none, so there is none until the numbering is
  # confirmed against the site itself.
  record_link: null
  # CHAPTER LINK, verified. Our 57 bab headings and sunnah.com's 57 chapters
  # are the same chapters in the same order: chapter 1 is
  # `باب ما جاء في خلق رسول الله صلى الله عليه وسلم` on both, and the 29
  # headings that differ do so only in spacing — `ماجاء` against `ما جاء`,
  # `ك حل` against `كحل` — at the same index.
  #
  # This is what a per-hadith link cannot yet be. The reader lands on the page
  # that contains their hadith, and the chapter title is on screen, so an
  # error would be visible rather than silent.
  chapter_link:
    label: "sunnah.com"
    labelAr: "سنة.كوم"
    url: "https://sunnah.com/shamail/{n}"
  layer_names:
    body: matn
    top: heading_kitab
    sub: heading_bab
    front: frontmatter
  curated_index_phantoms: false

gates:
  # MEASURED on the first binding run: 95.0% Tier 1+2 on matn, with every one
  # of its 406 records matched at median coverage 1.000.
  #
  # Threshold set below the measurement so it catches regression rather than
  # restating today's figure.
  min_witnessed_matn: 90.0
  min_retrieval_median: 0.85

about:
  description:
    - >-
      Al-Shamāʾil al-Muḥammadiyya — al-Tirmidhī's (d. 279 AH) collection on
      the person of the Prophet rather than on rulings: his appearance, his
      dress, his manner of speaking, eating and sleeping. 402 hadith across 57
      chapters.
    - >-
      Every word is tappable. This text has no frequency workbook of its own:
      its vocalisation is transferred from a vowelled edition, and its glosses
      are shared from al-Tajrīd, where the same word in the same reading
      carries the same entry. The panel's provenance line says which applies
      to each word.
  sources:
    - label: "Primary text"
      detail: >-
        OpenITI mARkdown transcription of a Shamela edition, fetched and
        checksummed at build time. Two OpenITI versions align equally well
        against the vowelled witness, at a median word overlap of 1.000; this
        one matched marginally more of its paragraphs.
      url: https://raw.githubusercontent.com/OpenITI/0300AH/master/data/0279Tirmidhi/0279Tirmidhi.ShamailMuhammadiyya/0279Tirmidhi.ShamailMuhammadiyya.Shamela0013037-ara1
    - label: "Vocalisation"
      detail: >-
        A vowelled text of the 402 hadith, scraped from sunnah.com, with 87.5%
        of its words carrying harakāt. Used only to transfer vocalisation onto
        the words of the primary text; none of it is redistributed here.
      url: https://github.com/AhmedBaset/hadith-json
    - label: "Meaning"
      detail: >-
        Glosses, lemmas and roots come from al-Tajrīd's curated lexicon, which
        is keyed by the written form rather than by the book it was written
        for. Words this text shares with al-Tajrīd inherit its scholarship;
        words it does not are vowelled but unglossed, and say so.
